name: Release

# ============================================
# release-please-driven release. One workflow, no PAT.
#
# Flow:
#   dev:      Conventional Commits (feat:/fix:/feat!:) → squash-merge to main
#   release:  release-please opens/updates a "chore: release X.Y.Z" PR that
#             bumps package.json (root + apps/web + apps/api), the Helm chart
#             (version + appVersion) and CHANGELOG.md — see
#             release-please-config.json.
#   merge:    the release PR merges → release-please creates tag vX.Y.Z and the
#             GitHub Release and sets release_created=true, which fans out to:
#             build+push both images, then package+push the Helm chart.
#
# Everything runs in this single workflow, so the GITHUB_TOKEN
# "can't trigger another workflow" rule never bites us — no PAT needed.
#
# Registry layout (image and chart must NOT share a package path):
#   images → ghcr.io/<owner>/foody-web:<version>, ghcr.io/<owner>/foody-api:<version>
#   chart  → ghcr.io/<owner>/charts/foody:<version>
# ============================================

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # release PR commit + create GitHub Release/tag
  pull-requests: write # open the "chore: release" PR
  packages: write # push image + Helm chart to ghcr.io

jobs:
  release:
    name: Release PR or Tag
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  image:
    name: Build & Push ${{ matrix.app }} image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/foody-${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  helm:
    name: Package & Push Helm chart
    needs: [release, image]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: helm package helm/foody

      # Pushed under /charts so the chart package path never collides with the
      # image packages (ghcr.io/<owner>/foody-*). Result: ghcr.io/<owner>/charts/foody
      - name: Push Helm chart to ghcr.io
        run: helm push foody-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
