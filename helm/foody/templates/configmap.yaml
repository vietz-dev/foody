apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foody.configMapName" . }}
  labels:
    {{- include "foody.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  HOSTNAME: "0.0.0.0"
  BETTER_AUTH_URL: {{ .Values.config.appUrl | quote }}
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  # In-cluster URL the web server uses to reach the api.
  API_URL: "http://{{ include "foody.fullname" . }}-api:{{ .Values.api.service.port }}"
