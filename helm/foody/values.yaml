# =============================================================================
# Foody Helm values
#
# Foody is a Next.js frontend (web) plus a Hono API (api), both stateless and
# backed by one PostgreSQL. Each runs as its own Deployment with 2 replicas.
# Point it at a Postgres via one of:
#   * postgres.enabled=true        → a bundled single-node Postgres StatefulSet
#                                     (quick start; fine for a single household).
#   * externalDatabase.*           → an external / operator-managed Postgres
#                                     (CNPG, cloud RDS, …) — the recommended path.
# Only web is exposed via Ingress/HTTPRoute; web talks to api in-cluster.
# =============================================================================

# --- Global settings ---
nameOverride: ''
fullnameOverride: ''

imagePullSecrets: []

# --- Service Account ---
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ''

# --- Components ---
# Images are built and pushed by the Release workflow (.github/workflows/release.yml):
#   ghcr.io/vietz-dev/foody-web:<version>   ghcr.io/vietz-dev/foody-api:<version>
# tag defaults to Chart.appVersion when left empty.
web:
  image:
    repository: ghcr.io/vietz-dev/foody-web
    tag: ''
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 3000
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  # `/` returns 200 (or a 3xx redirect to /login) once the server is up — both
  # count as healthy for an httpGet probe.
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

api:
  image:
    repository: ghcr.io/vietz-dev/foody-api
    tag: ''
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 3001
  service:
    type: ClusterIP
    port: 3001
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# --- Scheduling ---
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# --- Security contexts ---
# Both images run as the non-root `node` user (uid/gid 1000). readOnlyRootFilesystem
# is safe: all data lives in Postgres; scratch writes go to emptyDirs (/tmp, and
# the Next.js image cache for web).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Extra volumes/mounts for the app pod (beyond the DB volume + /tmp scratch).
extraVolumes: []
extraVolumeMounts: []

# --- Database migrations ---
# An initContainer on the api pods runs `prisma migrate deploy` before the api
# container starts. Uses the api image (ships the Prisma CLI, schema, migrations). Disable only if you apply migrations out-of-band.
migrations:
  enabled: true

# --- Bundled PostgreSQL (quick start) ---
# When enabled, the chart deploys a single-node Postgres StatefulSet and wires
# DATABASE_URL to it automatically. For anything beyond a single household prefer
# externalDatabase with a real operator (CNPG, cloud managed Postgres).
postgres:
  enabled: false
  image: postgres:17-alpine
  auth:
    username: foody
    database: foody
    # Used to create the chart-managed secret when enabled and no existingSecret.
    password: ''
    # Reference an existing secret holding key `password` instead of the above.
    existingSecret: ''
  persistence:
    size: 8Gi
    storageClass: ''
  resources: {}

# --- External PostgreSQL (recommended — used when postgres.enabled=false) ---
externalDatabase:
  # Option A (preferred — CNPG / operator): pull a ready-made DSN from a Secret.
  # CNPG publishes a full `postgres://…` connection string under the "uri" key of
  # its "<cluster>-app" secret; point existingSecret at it and you're done.
  existingSecret: ''
  existingSecretUrlKey: 'uri'
  # Option B: assemble the DSN from parts; password comes from a Secret key.
  # Set existingSecretUrlKey: "" to use this path.
  host: ''
  port: 5432
  database: foody
  username: foody
  existingSecretPasswordKey: 'password'
  sslmode: require

# --- Configuration (non-sensitive → ConfigMap) ---
config:
  # Public URL guests use to reach Foody. This is the better-auth base URL and
  # MUST match the ingress host and scheme.
  appUrl: 'https://foody.local'
  # Pocket ID / generic OIDC issuer (discovery at <issuer>/.well-known/openid-configuration).
  oidcIssuer: 'https://auth.vietz.dev'

# --- Secrets (sensitive → Kubernetes Secret) ---
# For production, create the Secret manually and set existingSecret. Otherwise
# the chart creates one from the values below (all required in that case).
# The Secret must expose these keys:
#   BETTER_AUTH_SECRET, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, ANTHROPIC_API_KEY
secrets:
  existingSecret: ''
  # openssl rand -base64 32
  betterAuthSecret: ''
  oidcClientId: ''
  oidcClientSecret: ''
  anthropicApiKey: ''

# --- Ingress ---
ingress:
  enabled: true
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: foody.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: foody-tls
    #   hosts:
    #     - foody.local

# --- Gateway API HTTPRoute (alternative to ingress) ---
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - foody.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
