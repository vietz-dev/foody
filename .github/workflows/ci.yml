name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: jdx/mise-action@v3
        with:
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Static analysis
        run: mise exec -- hk check --all

      - name: Detect new code duplication
        run: pnpm duplication

      - name: Build and test
        run: pnpm turbo run build test
        env:
          # The auth route is initialized while Next.js collects build-time
          # route metadata. A non-production value is sufficient in CI.
          BETTER_AUTH_SECRET: ci-build-secret

  lint-helm:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      # The chart's secret.yaml `required`s four keys when no existingSecret is
      # set — pass dummies so lint/template can render the default path.
      - name: Lint Helm chart
        run: |
          helm lint helm/foody \
            --set secrets.betterAuthSecret=ci-test \
            --set secrets.oidcClientId=ci-test \
            --set secrets.oidcClientSecret=ci-test \
            --set secrets.anthropicApiKey=ci-test

      - name: Template Helm chart
        run: |
          SECRETS="--set secrets.betterAuthSecret=ci --set secrets.oidcClientId=ci --set secrets.oidcClientSecret=ci --set secrets.anthropicApiKey=ci"
          echo "::group::defaults (chart-managed secret + ingress)"
          helm template test-release helm/foody $SECRETS
          echo "::endgroup::"
          echo "::group::existing secret + HTTPRoute instead of ingress"
          helm template test-release helm/foody \
            --set secrets.existingSecret=foody-secret \
            --set ingress.enabled=false \
            --set httpRoute.enabled=true
          echo "::endgroup::"
          echo "::group::persistence disabled (emptyDir), migrations off"
          helm template test-release helm/foody $SECRETS \
            --set persistence.enabled=false \
            --set migrations.enabled=false
          echo "::endgroup::"
